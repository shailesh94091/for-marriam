<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>For Marriam ♡</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #08080d;
  --text: #f5f0eb;
  --text-muted: rgba(245, 240, 235, 0.45);
  --accent: #e8b4b8;
  --accent-warm: #f2c6a0;
  --rose: #c9707d;
  --rose-soft: #f4c2c2;
  --gold: #d4a853;
  --lavender: #b8a9d4;
}

html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* ═══════════════════════════════════════
   THREE.JS CANVAS
   ═══════════════════════════════════════ */
#three-canvas {
  position: fixed; top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 0;
  opacity: 0;
  transition: opacity 2.5s cubic-bezier(0.16, 1, 0.3, 1);
}
#three-canvas.visible { opacity: 1; }

/* ═══════════════════════════════════════
   PHASE 0 — ENABLE SCREEN
   ═══════════════════════════════════════ */
#enable-screen {
  position: fixed; inset: 0;
  z-index: 200;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  background: var(--bg);
  transition: opacity 1.2s ease;
}
#enable-screen.hidden { opacity: 0; pointer-events: none; }

.enable-icon {
  width: 72px; height: 72px;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.08);
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 40px;
  backdrop-filter: blur(8px);
  background: rgba(255,255,255,0.02);
  animation: softBreathe 5s ease-in-out infinite;
}
@keyframes softBreathe {
  0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(232, 180, 184, 0); }
  50% { transform: scale(1.04); box-shadow: 0 0 40px 0 rgba(232, 180, 184, 0.08); }
}
.enable-icon svg { width: 26px; height: 26px; stroke: var(--accent); fill: none; stroke-width: 1.5; }

.enable-title {
  font-family: 'Playfair Display', serif;
  font-size: clamp(26px, 6vw, 38px);
  font-weight: 400;
  margin-bottom: 14px;
  letter-spacing: -0.5px;
}

.enable-sub {
  font-size: 15px;
  color: var(--text-muted);
  margin-bottom: 44px;
  line-height: 1.7;
  text-align: center;
  padding: 0 24px;
  font-weight: 300;
  letter-spacing: 0.2px;
}

.enable-btn {
  background: linear-gradient(135deg, var(--accent) 0%, var(--rose) 100%);
  border: none;
  color: #1a1a2e;
  font-family: 'Inter', sans-serif;
  font-size: 14px;
  font-weight: 600;
  padding: 15px 48px;
  border-radius: 100px;
  cursor: pointer;
  letter-spacing: 0.3px;
  transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
  box-shadow: 0 8px 40px rgba(232, 180, 184, 0.2), 0 2px 8px rgba(0,0,0,0.3);
  position: relative;
  overflow: hidden;
}
.enable-btn::before {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(135deg, rgba(255,255,255,0.2), transparent);
  opacity: 0;
  transition: opacity 0.4s ease;
}
.enable-btn:hover {
  transform: translateY(-3px);
  box-shadow: 0 16px 48px rgba(232, 180, 184, 0.3), 0 4px 12px rgba(0,0,0,0.3);
}
.enable-btn:hover::before { opacity: 1; }
.enable-btn:active { transform: translateY(-1px); }

/* ═══════════════════════════════════════
   PHASE 1 — CAMERA + SMILE DETECTION
   ═══════════════════════════════════════ */
#camera-phase {
  position: fixed; inset: 0;
  z-index: 100;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  background: var(--bg);
  transition: opacity 1.5s ease, transform 1.5s cubic-bezier(0.16, 1, 0.3, 1);
}
#camera-phase.fade-out {
  opacity: 0;
  transform: scale(1.08);
  pointer-events: none;
}

.camera-container {
  position: relative;
  width: min(320px, 75vw);
  aspect-ratio: 3 / 4;
  border-radius: 32px;
  overflow: hidden;
  box-shadow:
    0 0 0 1px rgba(255,255,255,0.05),
    0 32px 100px rgba(0,0,0,0.7),
    0 0 80px rgba(232, 180, 184, 0.06);
}

#camera-video {
  width: 100%; height: 100%;
  object-fit: cover;
  transform: scaleX(-1);
  border-radius: 32px;
}

.camera-overlay {
  position: absolute; inset: 0;
  border-radius: 32px;
  border: 1px solid rgba(255,255,255,0.06);
  pointer-events: none;
  background: linear-gradient(180deg, rgba(8,8,13,0.15) 0%, transparent 30%, transparent 70%, rgba(8,8,13,0.2) 100%);
}

.scan-line {
  position: absolute;
  left: 8%; right: 8%;
  height: 1px;
  background: linear-gradient(90deg, transparent 0%, var(--accent) 30%, var(--accent) 70%, transparent 100%);
  opacity: 0;
  animation: scanMove 4s ease-in-out infinite;
  filter: blur(0.5px);
  box-shadow: 0 0 12px rgba(232, 180, 184, 0.3);
}
@keyframes scanMove {
  0%, 100% { opacity: 0; top: 20%; }
  10% { opacity: 0.5; }
  90% { opacity: 0.5; }
  50% { top: 80%; }
}

/* Camera text */
.cam-text-area {
  margin-top: 40px;
  text-align: center;
  max-width: 420px;
  padding: 0 24px;
}

.cam-label {
  font-size: 10px;
  letter-spacing: 4px;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 18px;
  font-weight: 500;
  transition: all 0.6s ease;
}

.cam-message {
  font-family: 'Playfair Display', serif;
  font-size: clamp(16px, 4vw, 21px);
  font-weight: 400;
  line-height: 1.7;
  color: var(--text);
  min-height: 60px;
  opacity: 0;
  transform: translateY(10px);
  transition: opacity 0.9s ease, transform 0.9s ease;
}
.cam-message.visible { opacity: 1; transform: translateY(0); }
.cam-message em { color: var(--accent); font-style: italic; }

.smile-meter {
  margin-top: 32px;
  width: 180px;
  height: 2px;
  background: rgba(255,255,255,0.04);
  border-radius: 2px;
  overflow: hidden;
  margin-left: auto; margin-right: auto;
}
.smile-fill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, var(--accent), var(--rose));
  border-radius: 2px;
  transition: width 0.25s ease;
}

.skip-btn {
  margin-top: 28px;
  background: none;
  border: 1px solid rgba(255,255,255,0.07);
  color: rgba(245, 240, 235, 0.3);
  font-family: 'Inter', sans-serif;
  font-size: 12px;
  letter-spacing: 0.5px;
  padding: 10px 28px;
  border-radius: 100px;
  cursor: pointer;
  transition: all 0.4s ease;
  opacity: 0;
  animation: fadeUp 0.6s ease 5s forwards;
  font-weight: 400;
}
.skip-btn:hover {
  border-color: rgba(232, 180, 184, 0.3);
  color: var(--accent);
  background: rgba(232, 180, 184, 0.03);
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ═══════════════════════════════════════
   OVERLAY UI (text phases after camera)
   ═══════════════════════════════════════ */
#overlay {
  position: fixed; inset: 0;
  z-index: 50;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  pointer-events: none;
  padding: 40px 28px;
}

.overlay-content {
  text-align: center;
  max-width: 640px;
  opacity: 0;
  transform: translateY(24px);
  transition: opacity 1.4s ease, transform 1.4s cubic-bezier(0.16, 1, 0.3, 1);
}
.overlay-content.visible { opacity: 1; transform: translateY(0); }
.overlay-content.fade-out { opacity: 0; transform: translateY(-12px); }

/* Subtle glass backdrop for readability */
.overlay-content.visible .overlay-glass {
  background: rgba(8, 8, 13, 0.4);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-radius: 24px;
  padding: 48px 40px;
  border: 1px solid rgba(255,255,255,0.03);
}

.phase-label {
  font-size: 10px;
  letter-spacing: 5px;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 24px;
  font-weight: 500;
}

.phase-heading {
  font-family: 'Playfair Display', serif;
  font-size: clamp(28px, 6.5vw, 52px);
  font-weight: 400;
  line-height: 1.25;
  margin-bottom: 24px;
  letter-spacing: -0.7px;
}
.phase-heading .highlight {
  color: var(--accent);
  font-style: italic;
}

.phase-body {
  font-size: clamp(14px, 3vw, 17px);
  line-height: 1.85;
  color: var(--text-muted);
  font-weight: 300;
  letter-spacing: 0.2px;
}
.phase-body strong { color: var(--text); font-weight: 400; }

/* ═══════════════════════════════════════
   TAP HINT
   ═══════════════════════════════════════ */
.tap-hint {
  position: fixed;
  bottom: 36px; left: 50%;
  transform: translateX(-50%);
  font-size: 11px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--text-muted);
  opacity: 0;
  transition: opacity 1.5s ease;
  pointer-events: none;
  z-index: 60;
}
.tap-hint.visible { opacity: 0.4; }

/* ═══════════════════════════════════════
   FINAL NOTE
   ═══════════════════════════════════════ */
#final-note {
  position: fixed; inset: 0;
  z-index: 70;
  display: flex; flex-direction: column;
  align-items: center; justify-content: flex-start;
  padding: 0;
  opacity: 0;
  pointer-events: none;
  transition: opacity 2.5s ease;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}
#final-note.visible { opacity: 1; pointer-events: auto; }

/* Custom scrollbar for the note */
#final-note::-webkit-scrollbar { width: 4px; }
#final-note::-webkit-scrollbar-track { background: transparent; }
#final-note::-webkit-scrollbar-thumb { background: rgba(232, 180, 184, 0.15); border-radius: 4px; }

.note-spacer { min-height: 15vh; flex-shrink: 0; }

.note-card {
  max-width: 520px;
  text-align: center;
  padding: 0 28px 120px;
  position: relative;
}

.note-card .note-label {
  font-size: 10px;
  letter-spacing: 5px;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 40px;
  font-weight: 500;
}

.note-card .note-body {
  font-family: 'Playfair Display', serif;
  font-size: clamp(15px, 3.2vw, 19px);
  line-height: 2.1;
  font-weight: 400;
  color: rgba(245, 240, 235, 0.78);
  text-align: left;
}
.note-card .note-body em { color: var(--accent); font-weight: 500; }

.note-card .note-sign {
  margin-top: 48px;
  font-size: 13px;
  color: var(--text-muted);
  letter-spacing: 1px;
  font-family: 'Playfair Display', serif;
  font-style: italic;
}

.note-card .note-heart {
  margin-top: 24px;
  font-size: 32px;
  opacity: 0.6;
  animation: heartPulse 2.5s ease-in-out infinite;
}
@keyframes heartPulse {
  0%, 100% { transform: scale(1); }
  14% { transform: scale(1.18); }
  28% { transform: scale(1); }
  42% { transform: scale(1.12); }
  56% { transform: scale(1); }
}

/* ═══════════════════════════════════════
   CSS PETAL PARTICLES
   ═══════════════════════════════════════ */
.petal {
  position: fixed;
  pointer-events: none;
  z-index: 55;
  opacity: 0;
  animation: petalDrift linear forwards;
}
@keyframes petalDrift {
  0%   { opacity: 0; transform: translateY(-10px) translateX(0) rotate(0deg) scale(0.4); }
  8%   { opacity: 0.5; }
  50%  { transform: translateY(50vh) translateX(40px) rotate(200deg) scale(0.7); }
  85%  { opacity: 0.3; }
  100% { opacity: 0; transform: translateY(105vh) translateX(-20px) rotate(400deg) scale(0.5); }
}

/* Flower burst ring on click */
.click-ring {
  position: fixed;
  width: 8px; height: 8px;
  border-radius: 50%;
  border: 1px solid var(--accent);
  pointer-events: none;
  z-index: 56;
  opacity: 0.6;
  animation: ringExpand 1.2s ease-out forwards;
}
@keyframes ringExpand {
  to { width: 120px; height: 120px; margin: -60px 0 0 -60px; opacity: 0; border-width: 0.5px; }
}

/* ═══════════════════════════════════════
   SCROLL INDICATOR
   ═══════════════════════════════════════ */
.scroll-indicator {
  position: fixed;
  bottom: 32px; left: 50%;
  transform: translateX(-50%);
  z-index: 75;
  opacity: 0;
  transition: opacity 1s ease;
  pointer-events: none;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
}
.scroll-indicator.visible { opacity: 0.4; }
.scroll-indicator span {
  font-size: 10px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--text-muted);
}
.scroll-arrow {
  width: 1px; height: 20px;
  background: linear-gradient(to bottom, var(--accent), transparent);
  animation: scrollBob 2s ease-in-out infinite;
}
@keyframes scrollBob {
  0%, 100% { transform: translateY(0); opacity: 0.6; }
  50% { transform: translateY(6px); opacity: 1; }
}
</style>
</head>
<body>

<!-- ═══ Phase 0: Enable Camera ═══ -->
<div id="enable-screen">
  <div class="enable-icon">
    <svg viewBox="0 0 24 24">
      <path d="M15.75 10.5l4.72-4.72a.75.75 0 011.28.53v11.38a.75.75 0 01-1.28.53l-4.72-4.72M4.5 18.75h9a2.25 2.25 0 002.25-2.25v-9a2.25 2.25 0 00-2.25-2.25h-9A2.25 2.25 0 002.25 7.5v9a2.25 2.25 0 002.25 2.25z"/>
    </svg>
  </div>
  <div class="enable-title">Hey, Marriam</div>
  <div class="enable-sub">Someone built this just for you.<br>Allow camera access to begin.</div>
  <button class="enable-btn" id="start-btn">Let me in</button>
</div>

<!-- ═══ Phase 1: Camera + Detection ═══ -->
<div id="camera-phase" style="display:none;">
  <div class="camera-container">
    <video id="camera-video" autoplay playsinline muted></video>
    <div class="camera-overlay"></div>
    <div class="scan-line"></div>
  </div>
  <div class="cam-text-area">
    <div class="cam-label" id="cam-label">Analyzing</div>
    <div class="cam-message" id="cam-message"></div>
    <div class="smile-meter"><div class="smile-fill" id="smile-fill"></div></div>
    <button class="skip-btn" id="skip-btn">I can't use my camera right now</button>
  </div>
</div>

<!-- ═══ Three.js Canvas ═══ -->
<canvas id="three-canvas"></canvas>

<!-- ═══ Overlay messages ═══ -->
<div id="overlay">
  <div class="overlay-content" id="overlay-content"></div>
</div>
<div class="tap-hint" id="tap-hint">tap anywhere for flowers</div>

<!-- ═══ Final Note ═══ -->
<div id="final-note">
  <div class="note-spacer"></div>
  <div class="note-card">
    <div class="note-label">a note, just for you</div>
    <div class="note-body" id="note-body"></div>
    <div class="note-sign">— from the one who misses you most</div>
    <div class="note-heart">♡</div>
  </div>
</div>

<div class="scroll-indicator" id="scroll-indicator">
  <span>scroll</span>
  <div class="scroll-arrow"></div>
</div>

<!-- ═══ Scripts ═══ -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.162.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.162.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

// ──────────────────────────────────
// CONFIG
// ──────────────────────────────────
const SMILE_THRESHOLD = 0.28;
const PARTICLE_COUNT = 8000;
const NAME = 'MARRIAM';

// ──────────────────────────────────
// STATE
// ──────────────────────────────────
let currentPhase = 'enable';
let smileScore = 0;
let smileDetected = false;
let faceLandmarker = null;
let videoStream = null;
let animFrameId = null;

// Three.js
let scene, camera3d, renderer, composer, bloomPass;
let particleSystem, particlePositions, particleTargets, particleSizes;
let particleMaterial;
let clock = new THREE.Clock();
let mouseX = 0, mouseY = 0;
let targetMouseX = 0, targetMouseY = 0;
let flowerMeshes = [];
let ambientPetalMeshes = [];
let bgStars;

// ──────────────────────────────────
// DOM REFS
// ──────────────────────────────────
const $ = id => document.getElementById(id);
const $enableScreen = $('enable-screen');
const $startBtn = $('start-btn');
const $cameraPhase = $('camera-phase');
const $video = $('camera-video');
const $camLabel = $('cam-label');
const $camMessage = $('cam-message');
const $smileFill = $('smile-fill');
const $skipBtn = $('skip-btn');
const $canvas = $('three-canvas');
const $overlayContent = $('overlay-content');
const $tapHint = $('tap-hint');
const $finalNote = $('final-note');
const $noteBody = $('note-body');
const $scrollInd = $('scroll-indicator');

// ──────────────────────────────────
// CAMERA MESSAGES
// ──────────────────────────────────
const camMessages = [
  { text: 'Hold on, running a quick scan...', delay: 800 },
  { text: 'Wait — <em>is that sadness I detect?</em>', delay: 3500 },
  { text: 'System alert: traces of sadness found\non Marriam\'s face. That won\'t do.', delay: 6500 },
  { text: 'Someone has something for you.\nBut first — <em>smile for me?</em>', delay: 10000 },
];

// ──────────────────────────────────
// OVERLAY PHASES
// ──────────────────────────────────
const overlayPhases = [
  {
    label: 'smile verified ♡',
    heading: 'There it is.<br><span class="highlight">That smile.</span>',
    body: 'I knew it was hiding somewhere. That\'s all I ever needed to see.',
    duration: 5500,
  },
  {
    label: 'look around',
    heading: 'This whole universe?<br><span class="highlight">It\'s yours.</span>',
    body: 'Every single particle of light you see was placed here for you, Marriam. Each one a thought about you I couldn\'t keep to myself.',
    duration: 6500,
  },
  {
    label: 'distance means nothing',
    heading: 'I miss you,<br><span class="highlight">Marriam.</span>',
    body: 'I miss your voice. I miss your laugh. I miss how everything feels warmer when you\'re near. Even the silence feels heavier without you.',
    duration: 7500,
  },
  {
    label: 'from me to you',
    heading: 'I built this because<br><span class="highlight">words weren\'t enough.</span>',
    body: 'I wanted to give you something you could <strong>feel</strong>. Something that could carry even a fraction of what I feel — across all this distance between us.',
    duration: 7000,
    showTapHint: true,
  },
  {
    label: 'you make everything better',
    heading: 'You know what\'s<br><span class="highlight">funny?</span>',
    body: 'I\'m a tech guy. I build things with code. But nothing I\'ve ever built matters as much as making you smile right now. That\'s my greatest creation.',
    duration: 7000,
  },
];

// ──────────────────────────────────
// FINAL NOTE
// ──────────────────────────────────
const finalNoteText = `Marriam,

I know things have been hard lately. I know the distance feels endless some days, and I know there are moments where everything just feels <em>too much</em>.

But I need you to hear this — <em>everything is going to be okay.</em>

We are going to get through this. Not because it's easy, but because what we have is worth every hard day. Every quiet night spent apart is one night closer to being together again.

I think about you constantly. In the morning when the world is still quiet. At night when I wish you were right here next to me. In those random moments during the day when something reminds me of you and I smile without even realizing.

You are the strongest, most beautiful soul I have ever known. You make me want to be better, to build better, to love better. This little universe I coded? I built it because I couldn't sleep knowing you were sad and I wasn't there to hold you.

<em>We will see each other very soon.</em> And when that day comes — I'm not letting go. Not for a second.

Until then, carry this with you: someone out here is thinking about you every moment, missing you with every heartbeat, and counting down every single day until I get to see that smile in person again.

You are my favourite person in this entire universe, Marriam.

<em>Everything will be fine. I promise you.</em>`;

// ──────────────────────────────────
// INIT
// ──────────────────────────────────
$startBtn.addEventListener('click', startCamera);
$skipBtn.addEventListener('click', skipToReveal);

document.addEventListener('mousemove', e => {
  targetMouseX = (e.clientX / window.innerWidth - 0.5) * 2;
  targetMouseY = (e.clientY / window.innerHeight - 0.5) * 2;
});

document.addEventListener('click', e => {
  if (currentPhase === 'flowers' || currentPhase === 'note') {
    spawnFlowerBurst(e.clientX, e.clientY);
    spawnCSSPetals(e.clientX, e.clientY, 12);
    spawnClickRing(e.clientX, e.clientY);
    playChime();
  }
});

document.addEventListener('touchstart', e => {
  if (currentPhase === 'flowers' || currentPhase === 'note') {
    const t = e.touches[0];
    spawnFlowerBurst(t.clientX, t.clientY);
    spawnCSSPetals(t.clientX, t.clientY, 12);
    spawnClickRing(t.clientX, t.clientY);
    playChime();
  }
}, { passive: true });

// ──────────────────────────────────
// CAMERA
// ──────────────────────────────────
async function startCamera() {
  $enableScreen.classList.add('hidden');
  setTimeout(() => $enableScreen.style.display = 'none', 1200);
  $cameraPhase.style.display = 'flex';

  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: { ideal: 480 }, height: { ideal: 640 } }
    });
    videoStream = stream;
    $video.srcObject = stream;
    await $video.play();
    showCamMessages();
    await loadFaceLandmarker();
    startSmileDetection();
  } catch (err) {
    console.warn('Camera denied:', err);
    $camMessage.innerHTML = 'No camera? No worries.<br><em>I still have something for you.</em>';
    $camMessage.classList.add('visible');
    setTimeout(skipToReveal, 3000);
  }
}

async function loadFaceLandmarker() {
  try {
    const vision = await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/+esm');
    const { FaceLandmarker, FilesetResolver } = vision;
    const fs = await FilesetResolver.forVisionTasks(
      'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm'
    );
    faceLandmarker = await FaceLandmarker.createFromOptions(fs, {
      baseOptions: {
        modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task',
        delegate: 'GPU'
      },
      runningMode: 'VIDEO',
      numFaces: 1,
      outputFaceBlendshapes: true,
    });
  } catch (e) {
    console.warn('MediaPipe failed:', e);
    faceLandmarker = null;
  }
}

function startSmileDetection() {
  let lastTime = -1;
  let smoothScore = 0;

  function detect() {
    if (smileDetected) return;
    animFrameId = requestAnimationFrame(detect);

    const now = performance.now();
    if (now - lastTime < 80) return;
    lastTime = now;
    if (!faceLandmarker || $video.readyState < 2) return;

    try {
      const result = faceLandmarker.detectForVideo($video, now);

      if (result.faceLandmarks && result.faceLandmarks.length > 0) {
        const lm = result.faceLandmarks[0];

        // Landmark geometry
        const leftCorner = lm[61];
        const rightCorner = lm[291];
        const topLip = lm[13];
        const bottomLip = lm[14];
        const faceTop = lm[10];
        const faceBtm = lm[152];

        const mouthWidth = Math.hypot(rightCorner.x - leftCorner.x, rightCorner.y - leftCorner.y);
        const lipCenterY = (topLip.y + bottomLip.y) / 2;
        const cornerAvgY = (leftCorner.y + rightCorner.y) / 2;
        const cornerElevation = lipCenterY - cornerAvgY;
        const faceHeight = Math.abs(faceTop.y - faceBtm.y) || 0.3;

        const widthRatio = mouthWidth / faceHeight;
        const elevNorm = cornerElevation / faceHeight;
        const landmarkScore = Math.min(Math.max((widthRatio - 0.22) * 2.2 + elevNorm * 10, 0), 1);

        // Blendshape check
        let blendScore = 0;
        if (result.faceBlendshapes?.[0]) {
          const shapes = result.faceBlendshapes[0].categories;
          const sL = shapes.find(s => s.categoryName === 'mouthSmileLeft');
          const sR = shapes.find(s => s.categoryName === 'mouthSmileRight');
          if (sL && sR) blendScore = (sL.score + sR.score) / 2;
        }

        const raw = blendScore > 0.05 ? Math.max(blendScore, landmarkScore) : landmarkScore;

        // Exponential smoothing
        smoothScore = smoothScore * 0.6 + raw * 0.4;
        smileScore = Math.min(Math.max(smoothScore, 0), 1);

        $smileFill.style.width = (smileScore * 100) + '%';

        if (smileScore > SMILE_THRESHOLD) {
          smileDetected = true;
          onSmileDetected();
        }
      }
    } catch (e) { /* silent */ }
  }

  detect();
}

function showCamMessages() {
  camMessages.forEach(({ text, delay }) => {
    setTimeout(() => {
      if (smileDetected) return;
      $camMessage.classList.remove('visible');
      setTimeout(() => {
        $camMessage.innerHTML = text.replace(/\n/g, '<br>');
        $camMessage.classList.add('visible');
      }, 250);
    }, delay);
  });
}

function onSmileDetected() {
  if (animFrameId) cancelAnimationFrame(animFrameId);

  $smileFill.style.width = '100%';
  $smileFill.style.background = 'linear-gradient(90deg, var(--accent), var(--gold), var(--accent-warm))';
  $camLabel.textContent = '♡ smile detected';
  $camLabel.style.color = 'var(--accent)';

  $camMessage.classList.remove('visible');
  setTimeout(() => {
    $camMessage.innerHTML = '<em>There she is.</em><br>That\'s the smile I was looking for.';
    $camMessage.classList.add('visible');
  }, 300);

  setTimeout(() => {
    stopCamera();
    transitionToReveal();
  }, 3500);
}

function stopCamera() {
  if (videoStream) { videoStream.getTracks().forEach(t => t.stop()); videoStream = null; }
}

function skipToReveal() {
  smileDetected = true;
  if (animFrameId) cancelAnimationFrame(animFrameId);
  stopCamera();
  transitionToReveal();
}

function transitionToReveal() {
  $cameraPhase.classList.add('fade-out');
  setTimeout(() => {
    $cameraPhase.style.display = 'none';
    currentPhase = 'reveal';
    initThreeJS();
    runOverlaySequence();
  }, 1400);
}

function initThreeJS() {
  scene = new THREE.Scene();

  camera3d = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 3000);
  camera3d.position.set(0, 0, 500);

  renderer = new THREE.WebGLRenderer({ canvas: $canvas, antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setClearColor(0x08080d, 1);

  // Post-processing
  composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene, camera3d));
  bloomPass = new UnrealBloomPass(
    new THREE.Vector2(window.innerWidth, window.innerHeight),
    1.6, 0.6, 0.15
  );
  composer.addPass(bloomPass);

  createBackgroundStars();
  createParticles();
  createAmbientPetals3D();

  // Lights
  scene.add(new THREE.AmbientLight(0x332244, 0.3));
  const pLight1 = new THREE.PointLight(0xe8b4b8, 2.5, 900);
  pLight1.position.set(150, 120, 250);
  scene.add(pLight1);
  const pLight2 = new THREE.PointLight(0x9988cc, 1.5, 700);
  pLight2.position.set(-200, -80, 150);
  scene.add(pLight2);

  $canvas.classList.add('visible');
  window.addEventListener('resize', onResize);
  animateScene();
}

function createBackgroundStars() {
  const count = 3000;
  const pos = new Float32Array(count * 3);
  const cols = new Float32Array(count * 3);

  for (let i = 0; i < count; i++) {
    const i3 = i * 3;
    pos[i3]     = (Math.random() - 0.5) * 2500;
    pos[i3 + 1] = (Math.random() - 0.5) * 2000;
    pos[i3 + 2] = -200 - Math.random() * 800;

    const b = 0.5 + Math.random() * 0.5;
    cols[i3] = b; cols[i3+1] = b * 0.95; cols[i3+2] = b * 1.05;
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(cols, 3));

  const mat = new THREE.PointsMaterial({
    size: 1.5,
    vertexColors: true,
    transparent: true,
    opacity: 0.6,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
  });

  bgStars = new THREE.Points(geo, mat);
  scene.add(bgStars);
}

function createParticles() {
  const positions = new Float32Array(PARTICLE_COUNT * 3);
  const targets = new Float32Array(PARTICLE_COUNT * 3);
  const colors = new Float32Array(PARTICLE_COUNT * 3);
  const sizes = new Float32Array(PARTICLE_COUNT);
  const randoms = new Float32Array(PARTICLE_COUNT);

  const namePositions = getTextPositions(NAME, PARTICLE_COUNT);

  const palette = [
    [0.91, 0.71, 0.72],  // rose
    [0.95, 0.78, 0.63],  // gold warm
    [0.72, 0.66, 0.83],  // lavender
    [0.96, 0.94, 0.92],  // cream white
    [0.79, 0.44, 0.49],  // deep rose
    [0.83, 0.66, 0.33],  // rich gold
  ];

  for (let i = 0; i < PARTICLE_COUNT; i++) {
    const i3 = i * 3;

    // Start: galaxy scatter
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    const r = 200 + Math.random() * 900;
    positions[i3]     = r * Math.sin(phi) * Math.cos(theta);
    positions[i3 + 1] = r * Math.sin(phi) * Math.sin(theta);
    positions[i3 + 2] = (Math.random() - 0.5) * 500;

    // Targets: name positions
    if (namePositions[i]) {
      targets[i3]     = namePositions[i].x;
      targets[i3 + 1] = namePositions[i].y;
      targets[i3 + 2] = (Math.random() - 0.5) * 25;
    } else {
      // Orbit around name
      const orbitAngle = Math.random() * Math.PI * 2;
      const orbitR = 250 + Math.random() * 500;
      targets[i3]     = Math.cos(orbitAngle) * orbitR;
      targets[i3 + 1] = Math.sin(orbitAngle) * orbitR * 0.5;
      targets[i3 + 2] = (Math.random() - 0.5) * 300;
    }

    const c = palette[Math.floor(Math.random() * palette.length)];
    colors[i3] = c[0]; colors[i3+1] = c[1]; colors[i3+2] = c[2];

    sizes[i] = namePositions[i] ? (1.5 + Math.random() * 3) : (0.8 + Math.random() * 1.5);
    randoms[i] = Math.random();
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geo.setAttribute('aTarget', new THREE.BufferAttribute(targets, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  geo.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
  geo.setAttribute('aRandom', new THREE.BufferAttribute(randoms, 1));

  particlePositions = positions;
  particleTargets = targets;

  particleMaterial = new THREE.ShaderMaterial({
    uniforms: {
      uTime: { value: 0 },
      uMorph: { value: 0 },
      uPixelRatio: { value: Math.min(window.devicePixelRatio, 2) },
    },
    vertexShader: `
      attribute float size;
      attribute vec3 color;
      attribute vec3 aTarget;
      attribute float aRandom;
      uniform float uTime;
      uniform float uMorph;
      uniform float uPixelRatio;
      varying vec3 vColor;
      varying float vAlpha;

      void main() {
        vColor = color;

        // Interpolate position toward target
        vec3 pos = mix(position, aTarget, uMorph);

        // Organic floating
        float phase = aRandom * 6.28;
        pos.x += sin(uTime * 0.15 + phase + pos.y * 0.005) * (3.0 - uMorph * 2.0);
        pos.y += cos(uTime * 0.12 + phase + pos.x * 0.005) * (3.0 - uMorph * 2.0);
        pos.z += sin(uTime * 0.1 + phase * 2.0) * (2.0 - uMorph * 1.5);

        // Twinkle
        float twinkle = 0.7 + 0.3 * sin(uTime * 2.0 + aRandom * 20.0);

        vec4 mvPos = modelViewMatrix * vec4(pos, 1.0);
        gl_PointSize = size * uPixelRatio * (280.0 / -mvPos.z) * twinkle;
        gl_PointSize = clamp(gl_PointSize, 0.5, 14.0);
        gl_Position = projectionMatrix * mvPos;

        float dist = length(mvPos.xyz);
        vAlpha = smoothstep(1200.0, 80.0, dist) * twinkle;
      }
    `,
    fragmentShader: `
      varying vec3 vColor;
      varying float vAlpha;

      void main() {
        float d = length(gl_PointCoord - vec2(0.5));
        if (d > 0.5) discard;

        // Soft glow falloff
        float glow = 1.0 - smoothstep(0.0, 0.5, d);
        glow = pow(glow, 1.8);

        // Core brightness
        float core = smoothstep(0.15, 0.0, d) * 0.4;

        gl_FragColor = vec4(vColor * (1.0 + core), (glow + core) * vAlpha * 0.85);
      }
    `,
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
  });

  particleSystem = new THREE.Points(geo, particleMaterial);
  scene.add(particleSystem);
}

function getTextPositions(text, count) {
  const c = document.createElement('canvas');
  const ctx = c.getContext('2d');
  const w = 1200, h = 280;
  c.width = w; c.height = h;

  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, w, h);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 160px "Playfair Display", Georgia, serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, w / 2, h / 2);

  const data = ctx.getImageData(0, 0, w, h).data;
  const valid = [];

  for (let y = 0; y < h; y += 2) {
    for (let x = 0; x < w; x += 2) {
      if (data[(y * w + x) * 4] > 128) {
        valid.push({ x: (x - w/2) * 0.5, y: -(y - h/2) * 0.5 });
      }
    }
  }

  const result = [];
  const textCount = Math.min(Math.floor(count * 0.6), valid.length);
  for (let i = 0; i < count; i++) {
    if (i < textCount && valid.length) {
      result.push(valid[Math.floor(Math.random() * valid.length)]);
    } else {
      result.push(null);
    }
  }
  return result;
}

function createAmbientPetals3D() {
  const shape = new THREE.Shape();
  shape.moveTo(0, 0);

  const geo = new THREE.ShapeGeometry(shape);

  for (let i = 0; i < 50; i++) {

      color: colors[Math.floor(Math.random() * colors.length)],
      transparent: true,
      opacity: 0.15 + Math.random() * 0.15,
      side: THREE.DoubleSide,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
    });

    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(
      (Math.random() - 0.5) * 1200,
      300 + Math.random() * 200,
      (Math.random() - 0.5) * 400 - 50
    );
    mesh.rotation.set(Math.random()*Math.PI, Math.random()*Math.PI, Math.random()*Math.PI);
    const s = 5 + Math.random() * 12;
    mesh.scale.set(s, s, s);
    mesh.userData = {
      speed: 0.15 + Math.random() * 0.35,
      rotX: (Math.random()-0.5) * 0.008,
      rotY: (Math.random()-0.5) * 0.008,
      rotZ: (Math.random()-0.5) * 0.008,
      driftX: (Math.random()-0.5) * 0.15,
      wobbleAmp: 0.3 + Math.random() * 0.5,
      wobbleFreq: 0.5 + Math.random() * 1.5,
      phase: Math.random() * Math.PI * 2,
    };
    scene.add(mesh);
    ambientPetalMeshes.push(mesh);
  }
}

// MORPH
// ──────────────────────────────────
let morphProgress = 0;
let morphActive = false;
let morphStart = 0;
const MORPH_MS = 5000;

function startMorph() { morphActive = true; morphStart = performance.now(); }

function updateMorph() {
  if (!morphActive) return;
  const t = Math.min((performance.now() - morphStart) / MORPH_MS, 1);
  // Cubic ease-in-out
  morphProgress = t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2;
  particleMaterial.uniforms.uMorph.value = morphProgress;
  if (t >= 1) morphActive = false;
}

function spawnFlowerBurst(sx, sy) {
  const vec = new THREE.Vector3(
    (sx / window.innerWidth) * 2 - 1,
    -(sy / window.innerHeight) * 2 + 1,
    0.5
  );
  vec.unproject(camera3d);
  const dir = vec.sub(camera3d.position).normalize();
  const pos = camera3d.position.clone().add(dir.multiplyScalar(180));

  const count = 4 + Math.floor(Math.random() * 3);
  for (let i = 0; i < count; i++) {
    createFlower3D(
      pos.x + (Math.random()-0.5) * 70,
      pos.y + (Math.random()-0.5) * 70,
      pos.z + (Math.random()-0.5) * 30
    );
  }
}

function createFlower3D(x, y, z) {
  const group = new THREE.Group();
  group.position.set(x, y, z);

  const petalCount = 5 + Math.floor(Math.random() * 3);
  const flowerColors = [0xe8b4b8, 0xf4c2c2, 0xffb7c5, 0xf2c6a0, 0xc9707d, 0xd4a853];
  const color = flowerColors[Math.floor(Math.random() * flowerColors.length)];

  for (let i = 0; i < petalCount; i++) {
    const angle = (i / petalCount) * Math.PI * 2;
    const ps = new THREE.Shape();
    ps.moveTo(0, 0);
    ps.bezierCurveTo(2.5, 3.5, 1.2, 8, 0, 10);
    ps.bezierCurveTo(-1.2, 8, -2.5, 3.5, 0, 0);

    const pMat = new THREE.MeshBasicMaterial({
      color, transparent: true, opacity: 0.6,
      side: THREE.DoubleSide, blending: THREE.AdditiveBlending, depthWrite: false,
    });
    const petal = new THREE.Mesh(new THREE.ShapeGeometry(ps), pMat);
    petal.rotation.z = angle;
    petal.position.set(Math.cos(angle)*2, Math.sin(angle)*2, 0);
    group.add(petal);
  }

  // Glowing center
  const cg = new THREE.SphereGeometry(3, 8, 8);
  const cm = new THREE.MeshBasicMaterial({ color: 0xffeedd, transparent: true, opacity: 0.8 });
  group.add(new THREE.Mesh(cg, cm));

  group.scale.set(0, 0, 0);
  group.userData = {
    born: clock.getElapsedTime(),
    maxS: 0.6 + Math.random() * 1,
    rotSpd: (Math.random()-0.5) * 0.015,
    driftY: 0.08 + Math.random() * 0.2,
    life: 8 + Math.random() * 5,
  };
  scene.add(group);
  flowerMeshes.push(group);
}

function updateFlowers() {
  const now = clock.getElapsedTime();
  const dead = [];
  for (const f of flowerMeshes) {
    const age = now - f.userData.born;
    const { maxS, rotSpd, driftY, life } = f.userData;
    const scaleIn = Math.min(age / 1.0, 1);
    const eased = 1 - Math.pow(1 - scaleIn, 4);
    const fadeOut = age > life - 2.5 ? Math.max(0, (life - age) / 2.5) : 1;
    f.scale.setScalar(eased * maxS * fadeOut);
    f.rotation.z += rotSpd;
    f.position.y += driftY * 0.2;
    f.traverse(c => { if (c.material) c.material.opacity = 0.6 * fadeOut; });
    if (age > life) dead.push(f);
  }
  for (const d of dead) {
    scene.remove(d);
    d.traverse(c => { if(c.geometry) c.geometry.dispose(); if(c.material) c.material.dispose(); });
    flowerMeshes.splice(flowerMeshes.indexOf(d), 1);
  }
}

function updateAmbientPetals3D() {
  const time = clock.getElapsedTime();
  for (const p of ambientPetalMeshes) {
    const d = p.userData;
    p.position.y -= d.speed;
    p.position.x += d.driftX + Math.sin(time * d.wobbleFreq + d.phase) * d.wobbleAmp * 0.1;
    p.rotation.x += d.rotX;
    p.rotation.y += d.rotY;
    p.rotation.z += d.rotZ;
    if (p.position.y < -400) {
      p.position.y = 400 + Math.random() * 100;
      p.position.x = (Math.random()-0.5) * 1200;
    }
  }
}

// ──────────────────────────────────
// AUDIO
// ──────────────────────────────────
let audioCtx = null;
const chimeNotes = [523.25, 587.33, 659.25, 783.99, 880, 1046.50];

function playChime() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const freq = chimeNotes[Math.floor(Math.random() * chimeNotes.length)];

  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.value = freq;
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 2);
  osc.start();
  osc.stop(audioCtx.currentTime + 2);

  // Harmonic overtone
  const osc2 = audioCtx.createOscillator();
  const gain2 = audioCtx.createGain();
  osc2.type = 'sine';
  osc2.frequency.value = freq * 2;
  osc2.connect(gain2);
  gain2.connect(audioCtx.destination);
  gain2.gain.setValueAtTime(0.02, audioCtx.currentTime);
  gain2.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.5);
  osc2.start();
  osc2.stop(audioCtx.currentTime + 1.5);
}

// ──────────────────────────────────
// RENDER LOOP
// ──────────────────────────────────
function animateScene() {
  requestAnimationFrame(animateScene);
  const time = clock.getElapsedTime();

  particleMaterial.uniforms.uTime.value = time;

  // Smooth mouse
  mouseX += (targetMouseX - mouseX) * 0.04;
  mouseY += (targetMouseY - mouseY) * 0.04;
  camera3d.position.x += (mouseX * 35 - camera3d.position.x) * 0.025;
  camera3d.position.y += (-mouseY * 25 - camera3d.position.y) * 0.025;
  camera3d.lookAt(0, 0, 0);

  updateMorph();
  updateFlowers();
  updateAmbientPetals3D();

  // Gentle bg star rotation
  if (bgStars) bgStars.rotation.y = time * 0.003;

  // Gentle particle system breathing
  if (particleSystem) {
    particleSystem.rotation.y = Math.sin(time * 0.04) * 0.03;
    particleSystem.rotation.x = Math.sin(time * 0.03) * 0.01;
  }

  composer.render();
}

function onResize() {
  if (!camera3d) return;
  camera3d.aspect = window.innerWidth / window.innerHeight;
  camera3d.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
  particleMaterial.uniforms.uPixelRatio.value = Math.min(window.devicePixelRatio, 2);
}

// ──────────────────────────────────
// OVERLAY SEQUENCE
// ──────────────────────────────────
async function runOverlaySequence() {
  await delay(1800);
  startMorph();

  for (let i = 0; i < overlayPhases.length; i++) {
    const phase = overlayPhases[i];
    await showOverlayPhase(phase);
    if (phase.showTapHint) {
      $tapHint.classList.add('visible');
      currentPhase = 'flowers';
    }
    await delay(phase.duration);
    await hideOverlayPhase();
    await delay(700);
  }

  await delay(2000);
  showFinalNote();
}

function showOverlayPhase(phase) {
  return new Promise(resolve => {
    $overlayContent.innerHTML = `
      <div class="overlay-glass">
        <div class="phase-label">${phase.label}</div>
        <div class="phase-heading">${phase.heading}</div>
        <div class="phase-body">${phase.body}</div>
      </div>
    `;
    $overlayContent.classList.remove('fade-out');
    requestAnimationFrame(() => {
      $overlayContent.classList.add('visible');
      resolve();
    });
  });
}

function hideOverlayPhase() {
  return new Promise(resolve => {
    $overlayContent.classList.remove('visible');
    $overlayContent.classList.add('fade-out');
    setTimeout(resolve, 900);
  });
}

function showFinalNote() {
  currentPhase = 'note';
  $tapHint.classList.add('visible');
  $noteBody.innerHTML = finalNoteText.replace(/\n\n/g, '<br><br>');
  $finalNote.classList.add('visible');
  $scrollInd.classList.add('visible');

  // Continuous ambient CSS petals
  setInterval(() => {
    if (currentPhase !== 'note' && currentPhase !== 'flowers') return;
    spawnCSSPetals(Math.random() * window.innerWidth, -20, 1);
  }, 800);

  // Hide scroll indicator once scrolled
  $finalNote.addEventListener('scroll', () => {
    if ($finalNote.scrollTop > 40) $scrollInd.classList.remove('visible');
  }, { once: true });
}

// ──────────────────────────────────
// UTILS
// ──────────────────────────────────
function delay(ms) { return new Promise(r => setTimeout(r, ms)); }

</script>
